<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>iPad Wall Clock</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <div id="bg"></div>

  <div class="wrap">
    <div class="panel">

      <div class="top">
        <div id="city" class="city">Zapopan, Jalisco</div>
        <div id="updated" class="updated">—</div>
      </div>

      <div class="clock">
        <div id="time" class="time">--:--:--</div>
        <div id="date" class="date">—</div>
      </div>

      <div class="weather">

        <!-- CLIMA -->
        <div class="card">
          <div class="label">Clima actual</div>
          <div id="temp" class="temp">--°C</div>
          <div id="cond" class="cond">—</div>
        </div>

        <!-- CALENDARIO FAMILIAR -->
        <div class="card calendar-card">
          <div class="calendar-header">
            <div class="label">Calendario familiar</div>
            <div id="calendar-month" class="calendar-month">—</div>
          </div>

          <div class="calendar-weekdays" aria-hidden="true">
            <span>Lu</span>
            <span>Ma</span>
            <span>Mi</span>
            <span>Ju</span>
            <span>Vi</span>
            <span>Sá</span>
            <span>Do</span>
          </div>

          <div id="calendar-grid" class="calendar-grid">
            <div class="calendar-loading">Cargando…</div>
          </div>

          <div class="upcoming-section">
            <div class="upcoming-title">Próximos eventos</div>
            <div id="calendar-events" class="calendar-events">Cargando…</div>
          </div>

          <div id="calendar-status" class="calendar-status">—</div>
        </div>

        <!-- PRONÓSTICO -->
        <div class="card hourly-card">
          <div class="label">Próximas horas</div>
          <div id="hourly" class="hourly">Cargando…</div>
        </div>

        <!-- CATECISMO -->
        <div class="card catechism-card">
          <div class="cate-title">
            Catecismo Menor Westminster
          </div>

          <div id="cate-q" class="cate-q">
            —
          </div>

          <div id="cate-a" class="cate-a">
            —
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>

</body>
</html>
